<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/autoways.svg" />
    <link rel="canonical" href="https://autoways.com.np/" />
    <title>404 - Page Not Found | Autoways</title>
    <meta name="description" content="The page you are looking for doesn't exist or has been moved." />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #717171;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 6rem;
            font-weight: bold;
            color: #6a6a6a;
            margin-bottom: 1rem;
            line-height: 1;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #aaaaaa;
        }

        p {
            font-size: 1.125rem;
            color: #9ca3af;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: #059743;
            color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(5, 151, 67, 0.3);
        }

        .btn-primary:hover {
            background-color: #059743;
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(5, 151, 67, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: #353535;
            border: 1px solid #f5f5f5;
        }

        .btn-secondary:hover {
            background-color: #f5f5f5;
            color: #1a1a1a;
            transform: scale(1.05);
        }

        @media (min-width: 640px) {
            .button-group {
                flex-direction: row;
            }

            h1 {
                font-size: 9rem;
            }

            h2 {
                font-size: 2.5rem;
            }
        }

        svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you are looking for doesn't exist or has been moved.</p>

        <div class="button-group">
            <a href="/" class="btn btn-primary">
                Go to Homepage
            </a>

            <button onclick="history.back()" class="btn btn-secondary">
                Go Back
            </button>
        </div>
    </div>
</body>
</html>
